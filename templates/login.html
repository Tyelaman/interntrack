{% extends "layout.html" %}

{% block title %}
    Log In
{% endblock %}

{% block main %}
    <div class="auth-wrapper">
        <section class="auth-card">
            <p class="page-eyebrow">
                Welcome Back
            </p>

            <h1>
                Log In
            </h1>

            <p class="auth-card-subtitle">
                Access your saved internships and continue tracking
                your applications.
            </p>

            <form
                action="{{ url_for('login') }}"
                method="post"
            >
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label
                        for="username"
                        class="form-label"
                    >
                        Username
                    </label>

                    <input
                        autocomplete="username"
                        autofocus
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                        type="text"
                    >
                </div>

                <div class="mb-4">
                    <label
                        for="password"
                        class="form-label"
                    >
                        Password
                    </label>

                    <input
                        autocomplete="current-password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        type="password"
                    >
                </div>

                <button
                    class="btn btn-primary"
                    type="submit"
                >
                    Log In
                </button>
            </form>

            <p class="text-center mt-4 mb-0">
                Don’t have an account?

                <a
                    href="{{ url_for('register') }}"
                    class="fw-semibold"
                >
                    Create one
                </a>
            </p>
        </section>
    </div>
{% endblock %}
