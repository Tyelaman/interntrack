{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <form
        action="{{ url_for('register') }}"
        method="post"
        class="mx-auto text-center"
        style="max-width: 300px;"
    >
        <div class="mb-3">
            <input
                autocomplete="off"
                autofocus
                class="form-control"
                name="username"
                placeholder="Username"
                type="text"
            >
        </div>

        <div class="mb-3">
            <input
                class="form-control"
                name="password"
                placeholder="Password"
                type="password"
            >
        </div>

        <div class="mb-3">
            <input
                class="form-control"
                name="confirmation"
                placeholder="Confirm Password"
                type="password"
            >
        </div>

        <button class="btn btn-primary w-100" type="submit">
            Register
        </button>
    </form>
{% endblock %}
