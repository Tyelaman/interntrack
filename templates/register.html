{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <div class="auth-wrapper">
        <section class="auth-card">
            <p class="page-eyebrow">
                Get Started
            </p>

            <h1>
                Create an Account
            </h1>

            <p class="auth-card-subtitle">
                Build your internship tracker and keep your application
                process organized in one place.
            </p>

            <form
                action="{{ url_for('register') }}"
                method="post"
            >
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label
                        for="username"
                        class="form-label"
                    >
                        Username
                    </label>

                    <input
                        autocomplete="username"
                        autofocus
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        required
                        type="text"
                    >
                </div>

                <div class="mb-3">
                    <label
                        for="password"
                        class="form-label"
                    >
                        Password
                    </label>

                    <input
                        autocomplete="new-password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                        type="password"
                    >
                </div>

                <div class="mb-4">
                    <label
                        for="confirmation"
                        class="form-label"
                    >
                        Confirm Password
                    </label>

                    <input
                        autocomplete="new-password"
                        class="form-control"
                        id="confirmation"
                        name="confirmation"
                        placeholder="Enter your password again"
                        required
                        type="password"
                    >
                </div>

                <button
                    class="btn btn-primary"
                    type="submit"
                >
                    Create Account
                </button>
            </form>

            <p class="text-center mt-4 mb-0">
                Already have an account?

                <a
                    href="{{ url_for('login') }}"
                    class="fw-semibold"
                >
                    Log in
                </a>
            </p>
        </section>
    </div>
{% endblock %}
